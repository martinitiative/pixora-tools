<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b14" />
<title>Offline — PIXORA TOOLS</title>
<link rel="icon" href="https://i.ibb.co/j2wY85d/file-00000000031882119d721429cf3de75c.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: #070b14;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15), transparent 40%);
  background-attachment: fixed;
}
.wrap { text-align: center; max-width: 480px; }
.logo {
  width: 90px; height: 90px; border-radius: 22px;
  margin: 0 auto 24px; display: block;
  box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.icon {
  font-size: 60px; color: #3b82f6;
  margin-bottom: 20px; opacity: 0.55;
}
h1 {
  font-size: 34px; font-weight: 800;
  letter-spacing: -0.02em; margin-bottom: 14px;
  background: linear-gradient(120deg, #3b82f6, #8b5cf6, #06b6d4);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
p {
  font-size: 15px; color: #94a3b8;
  line-height: 1.7; margin-bottom: 30px;
}
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 28px; border-radius: 12px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  color: #fff; font-size: 14px; font-weight: 700;
  text-decoration: none; border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
  transition: all 0.3s ease; font-family: inherit;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(59, 130, 246, 0.5);
}
.brand {
  margin-top: 44px; font-size: 12px; color: #64748b;
  letter-spacing: 0.15em; text-transform: uppercase;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://i.ibb.co/j2wY85d/file-00000000031882119d721429cf3de75c.png" alt="PIXORA" />
  <div class="icon"><i class="fa-solid fa-wifi"></i></div>
  <h1>You're Offline</h1>
  <p>
    Your internet connection was lost. Most PIXORA tools still work offline —
    reconnect to access all features.
  </p>
  <a href="./index.html" class="btn">
    <i class="fa-solid fa-rotate"></i> Try Again
  </a>
  <div class="brand">PIXORA TOOLS</div>
</div>
</body>
</html>
